<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MindShift - Cognitive Challenge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="home">

        <div class="home-card">

            <div class="logo">🧠</div>

            <h1>MindShift</h1>

            <h2>Cognitive Perception Challenge</h2>

            <p>
                Test your memory, attention, reasoning,
                perception and ability to adapt.
            </p>

            <div class="skills">
                <span>🧠 Memory</span>
                <span>👁️ Attention</span>
                <span>🔄 Flexibility</span>
                <span>🧩 Reasoning</span>
            </div>

            <button id="startButton">
                Start Challenge
            </button>

            <p class="note">
                Answer correctly to continue.
                One mistake ends your run.
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
